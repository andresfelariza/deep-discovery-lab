<style>body{background:#eaf2f8;color:#14202b}.card{background:#fff;box-shadow:0 2px 8px #0001}
button{background:#0e7490;color:#fff}button.alt,.opt,.path{background:#f1f5f9;color:#14202b;border:1px solid #cbd5e1}button.go{background:#15803d;color:#fff}
.prog>div{background:#0e7490}.passage{font-size:1.08em;line-height:1.75;border-left:6px solid #0e7490}.qcard{border-left:6px solid #15803d}
.steps{background:#f1f5f9}.eqbox{background:#e0f2fe}.sent.picked{background:#fde68a;outline:none}.donep{opacity:.65}.good{color:#15803d}.bad{color:#b91c1c}

<body><div class="wrap"><h1>🔭 Deep Discovery Lab</h1><div id="ctl" class="card small"></div><div id="app"></div></div>
<script src="tracker.js"></script><script src="quest-engine.js"></script><script>
const MC=o=>Object.assign({type:'mc'},o),TAP=o=>Object.assign({type:'tap'},o),NUM=o=>Object.assign({type:'num'},o),STEPS=o=>Object.assign({type:'steps'},o);
const READ_STRAT=`<p><b>Level-up reading tools</b></p>
<p><b>1. Headline Test 📰, upgraded:</b> the main idea must cover the WHOLE passage, including the ending. Harder passages often build to a “so what?” in the last sentence. Make sure your headline includes it.</p>
<p><b>2. Prove It! 🔍, upgraded:</b> match the exact claim. A sentence that says something HAPPENS is different from one that explains WHY it happens. Read the question's key word (why? how? what?) twice.</p>
<p><b>3. Read Between the Lines 🧠 (inference & purpose):</b> combine two facts from the text to reach a conclusion the author didn't state. For author's purpose, ask: “What would be missing if this sentence were deleted?”</p>
<p><b>4. Source vs. Source ⚖️:</b> for each source, write a 3-word summary in your head, then ask: where do they agree, and where do they differ?</p>`;
const MATH_STRAT=`<p><b>Lab math toolkit 🧪</b></p>
<p><b>Unit rate:</b> divide to get “per 1.” 42 flashes in 3 min → 42 ÷ 3 = flashes per 1 minute.</p>
<p><b>Proportions:</b> find the scale factor or set equal ratios: 30/40 = x/260. Keep the SAME units in the same spot (top = top, bottom = bottom).</p>
<p><b>Percent change:</b> (new − old) ÷ old × 100. Always divide by the ORIGINAL amount.</p>
<p><b>Equation from a lab situation:</b> start + rate × time = goal. Define the variable first (“let m = minutes”).</p>
<p><b>Explain it:</b> a correct answer needs a correct reason. Check that the reason uses multiplying/scaling, not just adding.</p>`;
QuestEngine.start({game:'deep-discovery-lab',defaultPlayer:'Mateo',emoji:'🔬',unit:'discoveries',confBonus:true,
title:'Research Mission 2: Deep Discovery Lab',
story:'Field Scientist, you aced Mission 1, so you\'ve been promoted to Senior Researcher. The Deep Discovery Lab has two separate zones: the Reading Archive (harder research files) and the Lab Bench (science math). Pick a zone, finish both, and file your discoveries. One question at a time.',
strategy:`<p><b>⭐ Confidence = research data</b></p><p>Before each check, rate your confidence. You must pick; there's no default. Real scientists report how sure they are.</p>
<ul><li>😎 Sure + right → +5 “Called it!” bonus</li><li>😬 Guessing + not yet → +3 honesty bonus</li><li>🙂 Kinda sure → no bonus</li></ul>
<p>Each zone has its own strategy card. You'll see it when you enter. Tap 📇 anytime.</p>`,
hubTitle:'🗂️ Choose a zone or file',hubHint:'Reading files and lab math are separate. Do them in any order; finish all to complete the mission.',
paths:[
{id:'glow',emoji:'✨',name:'Reading File: Living Light',title:'Living Light',desc:'Why so many ocean animals glow.',strategy:READ_STRAT,doneMsg:'Living Light file complete!',passage:[
"Bioluminescence, the production of light by living organisms, is far more common than most people realize: one major survey found that about three-quarters of the animals it recorded in the open ocean, from the surface to nearly 4,000 meters deep, could make their own light.",
"The glow comes from a chemical reaction in which a molecule called luciferin combines with oxygen, a process accelerated by an enzyme called luciferase, releasing energy mostly as light rather than heat.",
"Because almost no sunlight penetrates below about 1,000 meters, these glowing signals function as a language of survival in a realm of permanent darkness.",
"The anglerfish dangles a glowing lure to attract unsuspecting prey, while certain shrimp and squid release clouds of luminous fluid to startle or distract predators as they escape.",
"Many animals in the dimly lit upper layers also use counterillumination, glowing softly from their undersides so that their silhouettes vanish against the faint light filtering down from above.",
"Scientists have even borrowed nature's toolkit: a green fluorescent protein first discovered in the crystal jelly, <i>Aequorea victoria</i>, is now used in laboratories worldwide to track how genes and cells behave, work recognized with the 2008 Nobel Prize in Chemistry."],items:[
MC({id:'gl-main',skill:'main-idea',label:'Headline Test',q:'Which headline best states the MAIN IDEA of the whole passage?',opts:['Anglerfish Use Glowing Lures to Catch Prey','Glowing Is Common in the Ocean, Helps Animals Survive, and Has Become a Science Tool','Sunlight Cannot Reach Below 1,000 Meters','A Jellyfish Protein Wins the Nobel Prize'],a:1,h:'Upgraded Headline Test: your headline must include the ending (the lab tool) too.',s:'Choice B covers how common it is, how animals use it, AND the scientific use at the end. The others are single details.'}),
TAP({id:'gl-evid',skill:'cite-evidence',label:'Prove It!',q:'Which sentence provides evidence that bioluminescence helps animals avoid being eaten? (More than one may work; tap the best.)',a:[3,4],h:'Look for animals escaping or hiding from predators.',s:'Sentence 4 (luminous clouds startle or distract predators) and Sentence 5 (counterillumination hides silhouettes) both show defense against predators.'}),
MC({id:'gl-infer',skill:'inference',label:'Read Between the Lines',q:'An animal living at 3,000 meters probably would NOT benefit from counterillumination. Why? Combine two sentences to decide.',opts:['Animals at 3,000 m cannot produce luciferin','Almost no light comes from above at that depth, so there is no bright background to hide a silhouette against','Counterillumination only works for anglerfish','Predators at 3,000 m cannot see light at all'],a:1,h:'Sentence 3 tells you how much sunlight reaches the deep. Sentence 5 tells you what counterillumination needs.',s:'Counterillumination hides you against light from above (S5), but below ~1,000 m almost no sunlight reaches (S3), so there\'s nothing to blend into.'})]},
{id:'mrna',emoji:'🧬',name:'Reading File: Instructions, Not Invaders',title:'Instructions, Not Invaders',desc:'How mRNA vaccines teach the immune system.',strategy:READ_STRAT,doneMsg:'mRNA file complete!',passage:[
"Your immune system learns to recognize a germ by its antigens, distinctive molecules, often proteins, on the germ's surface.",
"Traditional vaccines teach this lesson by introducing a weakened or inactivated germ, or purified pieces of one, so the body can rehearse its defense without suffering the actual disease.",
"An mRNA vaccine takes a different approach: instead of delivering the antigen itself, it delivers messenger RNA, a set of genetic instructions that directs the body's own cells to build one harmless piece of a virus, such as the spike protein of the coronavirus that causes COVID-19.",
"Cells read the instructions, manufacture the protein, and display it, prompting the immune system to produce antibodies and long-lived memory cells that can respond swiftly if the real virus ever appears.",
"The mRNA itself is fragile; it breaks down within days and never enters the nucleus, where a cell's DNA is stored, so it cannot alter a person's genes.",
"Although the first mRNA vaccines were authorized for widespread use in 2020, they rested on decades of research, including work by Katalin Karikó and Drew Weissman, who shared the 2023 Nobel Prize in Physiology or Medicine."],items:[
MC({id:'mr-main',skill:'main-idea',label:'Headline Test',q:'Which headline best states the MAIN IDEA?',opts:['Coronaviruses Have Spike Proteins','Two Scientists Win the 2023 Nobel Prize','mRNA Vaccines Give Cells Temporary Instructions to Train the Immune System','Traditional Vaccines Use Weakened Germs'],a:2,h:'The passage compares old and new vaccines but spends most sentences on how the new kind works.',s:'Choice C captures the central explanation: how mRNA vaccines work and why they\'re different. The others are details.'}),
TAP({id:'mr-evid',skill:'cite-evidence',label:'Prove It!',q:'Which sentence BEST proves that an mRNA vaccine cannot change a person\'s DNA?',a:4,h:'Find the sentence that mentions DNA and explains why it stays safe.',s:'Sentence 5: the mRNA breaks down within days and never enters the nucleus where DNA is stored.'}),
MC({id:'mr-purpose',skill:'author-purpose',label:'Read Between the Lines',q:'Why does the author include the final sentence about decades of research?',opts:['To show that a breakthrough that seemed sudden was actually built on many years of work','To argue that traditional vaccines no longer work','To explain how memory cells are produced','To list every scientist who studied mRNA'],a:0,h:'Ask: what would a reader wrongly believe if this sentence were deleted?',s:'Without it, readers might think mRNA vaccines were invented overnight in 2020. The author shows they came from decades of research.'})]},
{id:'mars',emoji:'🤖',name:'Reading File: Robots on Mars',title:'Robots on Mars',desc:'How rovers explore a planet they cannot be driven on.',strategy:READ_STRAT,doneMsg:'Mars file complete!',passage:[
"Since 1997, NASA has landed five rovers on Mars, and with each generation they have grown larger and more capable.",
"The first, Sojourner, was about the size of a microwave oven, while Perseverance, which landed in Jezero Crater in 2021, is roughly the size of a car and has a mass of about 1,025 kilograms.",
"Because radio signals take roughly 3 to 22 minutes to travel from Earth to Mars, depending on where the two planets are in their orbits, engineers cannot steer a rover in real time like a remote-control car.",
"Instead, modern rovers rely on autonomous navigation software that analyzes images of the terrain and selects safe paths on its own.",
"Jezero Crater was chosen because, billions of years ago, it held a lake fed by a river delta, precisely the kind of environment where traces of ancient microbial life might be preserved in rock.",
"Perseverance has been drilling rock cores and sealing them in tubes, in the hope that a future mission will carry the samples back to Earth, where laboratories far more powerful than anything a rover could carry can search them for evidence of life."],items:[
MC({id:'ma-main',skill:'main-idea',label:'Headline Test',q:'Which headline best states the MAIN IDEA?',opts:['Advanced, Self-Driving Rovers Search Mars for Signs of Ancient Life','Sojourner Was the Size of a Microwave','Radio Signals Travel Slowly','Jezero Crater Once Held a Lake'],a:0,h:'Cover the rovers getting smarter AND what they\'re searching for.',s:'Choice A covers the rovers\' growth, autonomy, and mission goal. The others are single details.'}),
TAP({id:'ma-evid',skill:'cite-evidence',label:'Prove It! (key word: WHY)',q:'Which sentence explains WHY rovers must navigate on their own?',a:2,h:'One sentence says they DO navigate on their own; another explains the REASON. Find the reason.',s:'Sentence 3: signals take 3 to 22 minutes, so real-time steering is impossible. (Sentence 4 says what they do, not why.)'}),
MC({id:'ma-infer',skill:'inference',label:'Read Between the Lines',q:'Based on the passage, which discovery in the returned samples would scientists probably find MOST exciting?',opts:['Proof that the rover\'s drill worked','Chemical or fossil traces of microbes that lived in the ancient lake','A rock that is heavier than expected','Evidence that Mars is cold today'],a:1,h:'Connect sentence 5 (why Jezero was chosen) with sentence 6 (what labs will search for).',s:'Jezero was picked because life might be preserved there (S5), and labs will search for evidence of life (S6), so traces of ancient microbes would be the jackpot.'})]},
{id:'sources',emoji:'🐋',name:'Reading File: Source vs. Source',title:'Two Sources on Whale Sounds',desc:'Compare two short texts about how whales use sound.',strategy:READ_STRAT,doneMsg:'Source comparison complete!',passage:[
"<span class='src'><b>Source A: from an ocean-science article</b><br>Toothed whales, such as dolphins and sperm whales, use echolocation: they emit rapid clicks and listen for the returning echoes, which reveal the size, shape, and distance of objects, even prey hidden in the sand. A sperm whale's clicks can reach about 230 decibels, making them among the loudest sounds produced by any animal.</span>",
"<span class='src'><b>Source B: from a marine-mammal field guide</b><br>Baleen whales, such as humpbacks and blue whales, are not known to echolocate. Instead, they rely on low-frequency calls and songs to communicate. A male humpback's song can last up to about 20 minutes and be repeated for hours, and the deep calls of blue whales can travel hundreds of kilometers through the ocean.</span>"],items:[
MC({id:'so-diff',skill:'compare-sources',label:'Source vs. Source',q:'How do the two sources DIFFER in focus?',opts:['Source A says whales are quiet; Source B says they are loud','Source A explains how toothed whales use sound to locate things; Source B explains how baleen whales use sound to communicate','Both sources only describe dolphins','Source A is about songs; Source B is about clicks'],a:1,h:'Give each source a 3-word summary first. A: “clicks find objects.” B: “?”',s:'A = toothed whales, echolocation to find objects. B = baleen whales, calls and songs to communicate over long distances.'}),
MC({id:'so-both',skill:'synthesize-sources',label:'Source vs. Source',q:'Which statement is supported by BOTH sources together?',opts:['All whales use echolocation','Baleen whales are louder than sperm whales','Different kinds of whales depend on sound, but use it in different ways','Humpback whales find prey hidden in the sand'],a:2,h:'Eliminate choices that one source contradicts or that neither source says.',s:'Both show whales relying on sound, A for finding objects and B for communicating. “All whales echolocate” is contradicted by B; the others aren\'t stated.'})]},
{id:'labmath',emoji:'🧪',name:'Lab Bench: Science Math',desc:'Rates, ratios, percents, and equations from real lab situations.',strategy:MATH_STRAT,doneMsg:'Lab Bench complete!',items:[
NUM({id:'lm-rate',skill:'unit-rate',label:'Lab 1 · Unit rate',q:'A firefly in the lab flashes 42 times in 3 minutes. At that rate, how many flashes per minute?',a:'14',h:'Divide to get “per 1 minute.”',s:'42 ÷ 3 = 14 flashes per minute'}),
NUM({id:'lm-prop',skill:'proportion',label:'Lab 2 · Proportion',q:'In a sample of 40 deep-sea animals, 30 could glow. At the same ratio, how many glowing animals would you expect in a sample of 260?',a:'195',h:'Set up 30/40 = x/260, or simplify 30/40 first.',s:'30/40 = 3/4\n3/4 × 260 = 195 animals'}),
NUM({id:'lm-pct',skill:'percent-change',label:'Lab 3 · Percent change',q:'A bacteria colony grew from 80 cells to 116 cells. What was the percent INCREASE?',a:'45',ph:'e.g. 45%',h:'(new − old) ÷ old × 100. Divide by the ORIGINAL amount.',s:'116 − 80 = 36\n36 ÷ 80 = 0.45 → 45% increase'}),
MC({id:'lm-write',skill:'write-equation',label:'Lab 4 · Write the equation',q:'A tank holds 12 liters of seawater. A pump adds 2.5 liters per minute. Which equation finds the number of minutes m until the tank holds 47 liters?',opts:['12m + 2.5 = 47','12 + 2.5m = 47','2.5 + 12 = 47m','47 + 2.5m = 12'],a:1,h:'Start + rate × time = goal.',s:'Start 12 L, rate 2.5 L/min → 12 + 2.5m = 47'}),
NUM({id:'lm-solve',skill:'solve-equation',label:'Lab 5 · Solve',q:'Solve 12 + 2.5m = 47. How many minutes?',a:'14',h:'Subtract 12, then divide by 2.5.',s:'2.5m = 35\nm = 35 ÷ 2.5 = 14 minutes\nCheck: 12 + 2.5(14) = 12 + 35 = 47 ✓'}),
STEPS({id:'lm-explain',skill:'proportional-reasoning-explain',label:'Lab 6 · Explain your thinking',q:'A growth gel recipe uses 3 grams of agar for every 200 mL of water. Your lab partner says that for 500 mL you need 6 grams, “because 500 is 300 more than 200, so add 3 more grams.”',h:'Is 500 mL ADDED to 200, or a MULTIPLE of 200?',s:'500 ÷ 200 = 2.5, so multiply: 3 × 2.5 = 7.5 g.\nRatios scale by multiplying, not by adding the same amount.',steps:[
{eq:'3 g : 200 mL = ? g : 500 mL',q:'How much agar is needed for 500 mL?',opts:['6 g','7.5 g','5 g','8 g'],a:1,res:'7.5 g',why:'500 ÷ 200 = 2.5, and 3 × 2.5 = 7.5.'},
{eq:'3 g : 200 mL = 7.5 g : 500 mL',q:'Which explanation is correct?',opts:['500 is 2.5 times 200, so multiply 3 g by 2.5. Ratios scale by multiplying.','Add 3 g for every extra 300 mL, so 3 + 3 = 6.','Subtract: 500 − 200 = 300, so use 300 ÷ 100 = 3 g.','The agar amount never changes, so it stays 3 g.'],a:0,res:'',why:'In a proportion both quantities are multiplied by the same scale factor.'}]})]}],
reflectChips:['Upgraded Headline Test','Prove It: matching WHY','Combining two sentences','Source vs. Source','Unit rate / scale factor','Divide by the original'],
reflectQ:'Which strategy helped you most today, and why?',winMsg:'Research Mission 2 complete, Senior Researcher! 🏅'});
</script></body></html>
